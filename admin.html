<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel — Navratri Passes B2B</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- ═══ PIN LOCK SCREEN ═══ -->
  <div class="pin-screen" id="pinScreen">
    <div class="pin-card">
      <div class="pin-logo">N</div>
      <h1>Admin Access</h1>
      <p>Enter PIN to access the event management dashboard</p>
      <input type="password" id="pinInput" class="pin-input" placeholder="Enter PIN" maxlength="20" autocomplete="off">
      <div class="pin-error" id="pinError">Incorrect PIN. Try again.</div>
      <button class="pin-btn" id="pinSubmitBtn" onclick="verifyPin()">
        <i class="fa-solid fa-lock-open"></i> Unlock Dashboard
      </button>
    </div>
  </div>

  <!-- ═══ ADMIN DASHBOARD ═══ -->
  <div class="admin-dashboard" id="adminDashboard">

    <!-- Header -->
    <header class="admin-header">
      <a href="admin.html" class="admin-brand">
        <img src="assets/rangsetu_logo.jpg" alt="RANGSETU Logo" style="width:34px; height:34px; border-radius:8px; object-fit:cover;">
        <div class="admin-brand-text">RANGSETU <span>Admin</span></div>
      </a>
      <div class="admin-header-actions">
        <a href="index.html" target="_blank" class="admin-btn-outline">
          <i class="fa-solid fa-external-link"></i> View Site
        </a>
        <button class="admin-btn-outline" onclick="resetDefaultEvents()">
          <i class="fa-solid fa-rotate-left"></i> Reset Defaults
        </button>
        <button class="admin-btn-outline" onclick="exportEvents()">
          <i class="fa-solid fa-download"></i> Export
        </button>
        <label class="admin-btn-outline" style="cursor:pointer;">
          <i class="fa-solid fa-upload"></i> Import
          <input type="file" accept=".json" id="importFileInput" style="display:none;" onchange="importEvents(event)">
        </label>
        <button class="admin-btn-danger" onclick="logout()">
          <i class="fa-solid fa-right-from-bracket"></i> Logout
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="admin-main">

      <!-- Stats -->
      <div class="admin-stats" id="adminStats">
        <div class="stat-card">
          <div class="stat-label">Total Events</div>
          <div class="stat-value text-blaze" id="statTotal">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Admin Added</div>
          <div class="stat-value text-success" id="statAdmin">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Default Events</div>
          <div class="stat-value text-warning" id="statDefault">0</div>
        </div>
      </div>

      <!-- Events Management -->
      <div class="admin-section">
        <div class="admin-section-header">
          <h2><i class="fa-solid fa-calendar-star"></i> Event Management</h2>
          <button class="admin-btn-primary" id="toggleFormBtn" onclick="toggleForm()">
            <i class="fa-solid fa-plus"></i> Add Event
          </button>
        </div>

        <!-- Add/Edit Form -->
        <div class="admin-form-panel" id="eventFormPanel">
          <form id="eventForm" onsubmit="saveEvent(event)">
            <input type="hidden" id="editEventId" value="">
            <div class="form-grid">
              <div class="admin-form-group">
                <label class="admin-form-label" for="eventName">Event Name *</label>
                <input type="text" id="eventName" class="admin-form-input" placeholder="e.g. Karnavati Club Garba 2026" required>
              </div>
              <div class="admin-form-group">
                <label class="admin-form-label" for="eventLocation">Location *</label>
                <input type="text" id="eventLocation" class="admin-form-input" placeholder="e.g. S.G. Highway, Bodakdev" required>
              </div>
              <div class="admin-form-group">
                <label class="admin-form-label" for="eventCity">City</label>
                <input type="text" id="eventCity" class="admin-form-input" value="Ahmedabad">
              </div>
              <div class="admin-form-group">
                <label class="admin-form-label" for="eventDates">Dates *</label>
                <input type="text" id="eventDates" class="admin-form-input" placeholder="e.g. Oct 11 – Oct 19, 2026" required>
              </div>
              <div class="admin-form-group">
                <label class="admin-form-label" for="eventArtist">Artist / Performer</label>
                <input type="text" id="eventArtist" class="admin-form-input" placeholder="e.g. Kinjal Dave & Live Band">
              </div>
              <div class="admin-form-group">
                <label class="admin-form-label" for="eventType">Category</label>
                <select id="eventType" class="admin-form-select">
                  <option value="ahmedabad">Ahmedabad</option>
                  <option value="vip">VIP</option>
                </select>
              </div>
              <div class="admin-form-group">
                <label class="admin-form-label" for="eventPassTypes">Pass Types</label>
                <input type="text" id="eventPassTypes" class="admin-form-input" placeholder="e.g. General / VIP / Premium" value="General / VIP / Premium">
                <div class="pass-type-pills" id="passTypePills">
                  <button type="button" class="pass-pill-btn selected" data-type="General"><i class="fa-solid fa-plus"></i> General</button>
                  <button type="button" class="pass-pill-btn selected" data-type="VIP"><i class="fa-solid fa-plus"></i> VIP</button>
                  <button type="button" class="pass-pill-btn selected" data-type="Premium"><i class="fa-solid fa-plus"></i> Premium</button>
                  <button type="button" class="pass-pill-btn" data-type="Season"><i class="fa-solid fa-plus"></i> Season</button>
                  <button type="button" class="pass-pill-btn" data-type="Couple"><i class="fa-solid fa-plus"></i> Couple</button>
                </div>
              </div>
              <div class="admin-form-group">
                <label class="admin-form-label" for="eventFormats">Pass Formats</label>
                <select id="eventFormats" class="admin-form-select">
                  <option value="Physical & Online Available">Physical & Online</option>
                  <option value="Physical Pass">Physical Only</option>
                  <option value="Online Pass">Online Only</option>
                </select>
              </div>
              <div class="admin-form-group">
                <label class="admin-form-label" for="eventBadge">Badge Label</label>
                <input type="text" id="eventBadge" class="admin-form-input" placeholder="e.g. Verified B2B Venue" value="Verified B2B Venue">
              </div>
              <div class="admin-form-group">
                <label class="admin-form-label" for="eventAvailability">Availability</label>
                <select id="eventAvailability" class="admin-form-select">
                  <option value="High Inventory">High Inventory</option>
                  <option value="Selling Fast">Selling Fast</option>
                  <option value="Limited Seats">Limited Seats</option>
                  <option value="Sold Out">Sold Out</option>
                </select>
              </div>
              <div class="admin-form-group">
                <label class="admin-form-label" for="eventPrice">B2B Price Label</label>
                <input type="text" id="eventPrice" class="admin-form-input" value="Get B2B Rate">
              </div>

              <!-- Image Upload -->
              <div class="admin-form-group full-width">
                <label class="admin-form-label">Event Image</label>
                <div class="image-upload-area" id="imageUploadArea" onclick="document.getElementById('eventImageFile').click()">
                  <i class="fa-solid fa-cloud-arrow-up"></i>
                  <span>Click to upload image (JPG, PNG)</span>
                  <img class="image-upload-preview" id="imagePreview" alt="Preview">
                </div>
                <input type="file" id="eventImageFile" accept="image/*" style="display:none;" onchange="handleImageUpload(event)">
                <input type="hidden" id="eventImageData" value="">
              </div>
            </div>

            <div class="form-actions">
              <button type="button" class="admin-btn-outline" onclick="cancelForm()">Cancel</button>
              <button type="submit" class="admin-btn-primary" id="formSubmitBtn">
                <i class="fa-solid fa-check"></i> Save Event
              </button>
            </div>
          </form>
        </div>

        <!-- Events Table -->
        <div class="admin-table-wrap">
          <table class="admin-table" id="eventsTable">
            <thead>
              <tr>
                <th style="width: 40px; text-align: center;"><i class="fa-solid fa-arrows-up-down" title="Drag to reorder"></i></th>
                <th>Event</th>
                <th>Dates</th>
                <th>Pass Types</th>
                <th>Availability</th>
                <th>Source</th>
                <th style="text-align:right;">Actions</th>
              </tr>
            </thead>
            <tbody id="eventsTableBody">
              <!-- Rendered by JS -->
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <!-- Toast -->
  <div class="admin-toast" id="adminToast">
    <i class="fa-solid fa-circle-check"></i>
    <span id="toastMsg">Event saved!</span>
  </div>

  <script src="admin.js"></script>
</body>
</html>
